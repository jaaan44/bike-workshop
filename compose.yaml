# Bicycle Workshop — canonical Docker Compose setup.
#
# This is the ONE supported Docker workflow for this project, and the VPS
# is its primary target — the same file also works for local development.
# There is no GitHub Codespaces/devcontainer support; this project is
# developed and run directly against Docker.
#
# Usage:
#   docker compose build            # build/rebuild the app image
#   docker compose up -d            # app + mysql (what you want 95% of the time)
#   docker compose --profile dev up -d vite   # optional: also start the Vite dev server
#   docker compose down             # stop everything
#   docker compose logs -f          # tail logs
#
# Host ports are configurable via .env (see .env.example):
#   APP_PORT=8013          browser/reverse proxy -> 127.0.0.1:8013 -> app container :80
#   DB_FORWARD_PORT=3348   host MySQL client -> 127.0.0.1:3348 -> mysql container :3306
#   VITE_FORWARD_PORT=5175 (only relevant if the optional `vite` service is started)
#
# Inside the Docker network, Laravel always talks to MySQL as `mysql:3306`
# — the host-side port mapping above is irrelevant from inside the app
# container and must not be used for DB_HOST/DB_PORT.
#
# Network exposure (Phase 11C): the `app` port is bound to 127.0.0.1 only —
# it is meant to be reached through a host reverse proxy (e.g. host Nginx
# terminating HTTPS), never directly from the public internet. `mysql`
# publishes no host port at all by default: nothing outside the Docker
# network can reach it, which matters on a shared VPS where other,
# unrelated apps' processes also run on the same host and could otherwise
# reach a loopback-bound port. Local development gets its MySQL host port
# back via `compose.override.yaml` (auto-merged by a plain `docker compose
# up`, see that file) — a staging/production host should set
# `COMPOSE_FILE=compose.yaml` in its own `.env` so that override never
# applies there, without needing any uncommitted edit to this file.
#
# Shared-VPS safety: every container name, volume name, and the network
# name below are prefixed `bicycle_workshop_` specifically so this project
# never collides with other applications (e.g. Pickleverse, Company App)
# running on the same Docker host. Never run `docker compose down -v`
# unless you explicitly intend to delete this project's MySQL data volume
# — it does not touch other projects' volumes either way.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bicycle_workshop_app
    container_name: bicycle_workshop_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8013}:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - .:/var/www/html
      # Bind-mounting the full repo above would otherwise hide the vendor/
      # and public/build trees baked into the image at build time (a bare
      # host checkout has neither until you run composer/npm yourself).
      # Named volumes mounted at these specific subpaths take precedence
      # over the parent bind mount, and Docker seeds a named volume from
      # the image's own content the first time it's used — so these
      # transparently keep the image's build output in place.
      - bicycle_workshop_vendor:/var/www/html/vendor
      - bicycle_workshop_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bicycle_workshop

  mysql:
    image: mysql:8.4
    container_name: bicycle_workshop_mysql
    restart: unless-stopped
    # No host port published by default (Phase 11C) — reachable only from
    # inside the `bicycle_workshop` Docker network (i.e. from the `app`
    # container as `mysql:3306`). Local development gets a host-published
    # port for GUI clients via compose.override.yaml instead of here — see
    # the comment above this service block.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bike_workshop}
      MYSQL_USER: ${DB_USERNAME:-sail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - bicycle_workshop_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bicycle_workshop

  # Optional, dev-only Vite server with hot module reload. Never starts
  # with a plain `docker compose up` — only via `--profile dev` — so the
  # VPS/production runtime never runs it; production always serves the
  # assets built into the image at `docker compose build` time instead.
  vite:
    build:
      context: .
      dockerfile: Dockerfile
    image: bicycle_workshop_app
    container_name: bicycle_workshop_vite
    profiles: ["dev"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_FORWARD_PORT:-5175}:5173"
    volumes:
      - .:/var/www/html
      # node_modules gets its own volume for the same reason vendor/ does
      # above, plus it avoids mounting host-installed native npm binaries
      # (a different OS/arch than the container) into the container.
      - bicycle_workshop_node_modules:/var/www/html/node_modules
    networks:
      - bicycle_workshop

networks:
  bicycle_workshop:
    name: bicycle_workshop_network

volumes:
  bicycle_workshop_mysql_data:
    name: bicycle_workshop_mysql_data
  bicycle_workshop_vendor:
    name: bicycle_workshop_vendor
  bicycle_workshop_build:
    name: bicycle_workshop_build
  bicycle_workshop_node_modules:
    name: bicycle_workshop_node_modules
